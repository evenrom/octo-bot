<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octo-Bot World Cup Predictions</title>

    <!-- Google Fonts: Space Grotesk, Sora, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Sora:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space-grotesk': ['Space Grotesk', 'sans-serif'],
                        'sora': ['Sora', 'sans-serif'],
                        'jetbrains-mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
 
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles.css">
    <link id="favicon" rel="icon" type="image/png" href="">

</head>
<body class="bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#171f33] to-[#0b1326] text-[#dae2fd] min-h-screen flex flex-col font-sora">

    <!-- Top App Bar -->
    <header class="bg-white/5 backdrop-blur-[24px] border-b border-white/10 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 p-4">
            <h1 class="text-2xl font-space-grotesk font-bold tracking-tight text-blue-400">Octo-Bot</h1>

            <div class="flex items-center gap-6">
                <!-- Global Stats (expanded to occupy available space) -->
                <div class="flex-1 flex items-center justify-end">
                    <div id="accuracy-score" class="mt-1 w-full max-w-[360px]"></div>
                </div>

                <!-- Manual Triggers (compact) -->
                <div class="flex gap-2 flex-none">
                    <button id="btn-sync" class="bg-[#39ff14] text-black active:scale-95 duration-100 px-2 py-1 rounded font-semibold text-xs transition-all flex items-center justify-center gap-2 min-w-[88px] font-sora hover:bg-[#39ff14]/90">
                        <span>SYNC</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto">

<section class="mt-8 mb-12 flex flex-col justify-center items-center">
    <canvas id="mascot-canvas" width="192" height="208" class="mx-auto cursor-pointer transition-transform duration-200 hover:scale-105"></canvas>
    <div id="algorithm-status" class="mt-4 text-sm text-[#dae2fd]/70 font-sora">
    </div>
</section>
    
        <!-- Loading State for Initial Data -->
        <div id="main-loader" class="flex flex-col items-center justify-center py-12 hidden">
            <div class="loader w-10 h-10 mb-4 border-t-[#39ff14] border-4 border-[#171f33]"></div>
            <p class="text-[#dae2fd]/70 font-space-grotesk">Consulting the oracle...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded mb-8 hidden font-sora mx-4 lg:mx-10">
        </div>

        <!-- Data Grid -->
        <section id="data-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 m-4 lg:m-10">
            <!-- Prediction Cards will be dynamically inserted here -->
        </section>

    </main>

    <footer class="bg-[#0b1326] p-4 text-center text-sm text-[#dae2fd]/50 font-space-grotesk border-t border-white/10">
        <p>&copy; Octo-Bot Predictions. Data strictly read from Database.</p>
    </footer>

    <!-- Application Logic -->
    <script src="/app.js"></script>
</body>
</html>
