<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octo-Bot World Cup Predictions</title>

    <!-- Google Fonts: Space Grotesk, Sora, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Sora:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'space-grotesk': ['Space Grotesk', 'sans-serif'],
                        'sora': ['Sora', 'sans-serif'],
                        'jetbrains-mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
/* Custom Loading Spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Hardware-Accelerated Mascot Sprite --- */
        .mascot-wrapper {
            width: 256px;
            height: 256px;
            margin: 0 auto;
            overflow: hidden; /* חור ההצצה שלנו - מסתיר את שאר התמונה */
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .mascot-wrapper:hover {
            transform: scale(1.05); /* אפקט הריחוף הועבר לעטיפה כדי לא להפריע לאנימציה */
        }

        .mascot {
            width: 2304px; /* הרוחב המלא של כל 9 הפריימים יחד */
            height: 2304px; /* הגובה המלא */
            background-image: url('./spritesheet.webp');
            background-size: 2304px 2304px;
            background-repeat: no-repeat;
            
            /* שימוש ב-transform מבטיח קפיצות פיקסלים נקיות דרך הכרטיס הגרפי */
            animation: playX 0.9s steps(9) infinite;
            
            /* הסרת כל transition שעשוי לגרום להחלקת האנימציה */
            transition: none !important; 
        }

        /* השליטה בציר ה-Y מתבצעת כעת על ידי משיכת התמונה למעלה (margin) */
        .state-idle { margin-top: 0px; }
        .state-running { margin-top: -256px; }
        .state-rolling { margin-top: -1536px; }
        .state-failed { margin-top: -1792px; }

        @keyframes playX {
            from { transform: translateX(0px); }
            to { transform: translateX(-2304px); }
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#171f33] to-[#0b1326] text-[#dae2fd] min-h-screen flex flex-col font-sora">

    <!-- Top App Bar -->
    <header class="bg-white/5 backdrop-blur-[24px] border-b border-white/10 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 p-4">
            <h1 class="text-2xl font-space-grotesk font-bold tracking-tight text-blue-400">🐙 Octo-Bot</h1>

            <div class="flex items-center gap-6">
                <!-- Accuracy Score -->
                <div class="flex flex-col items-center">
                    <span class="text-xs uppercase text-[#dae2fd]/70 font-semibold tracking-wider font-sora">Global Accuracy</span>
                    <span id="accuracy-score" class="text-xl font-jetbrains-mono font-bold text-[#39ff14]">--%</span>
                </div>

                <!-- Manual Triggers -->
                <div class="flex gap-2">
                    <button id="btn-sync" class="bg-[#39ff14] text-black active:scale-95 duration-100 px-4 py-2 rounded font-semibold text-sm transition-all flex items-center justify-center gap-2 min-w-[140px] font-sora hover:bg-[#39ff14]/90">
                        <span>FETCH FIXTURES</span>
                    </button>
                    <button id="btn-calibrate" class="bg-[#ffb77d] text-black active:scale-95 duration-100 px-4 py-2 rounded font-semibold text-sm transition-all flex items-center justify-center gap-2 min-w-[160px] font-sora hover:bg-[#ffb77d]/90">
                        <span>RESOLVE RESULTS</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto">

<section class="mt-8 mb-12 flex flex-col justify-center items-center">
        <div class="mascot-wrapper">
            <div id="mascot" class="mascot state-idle"></div>
        </div>
        <div id="algorithm-status" class="mt-4 text-sm text-[#dae2fd]/70 font-sora">
            </div>
    </section>
    
        <!-- Loading State for Initial Data -->
        <div id="main-loader" class="flex flex-col items-center justify-center py-12 hidden">
            <div class="loader w-10 h-10 mb-4 border-t-[#39ff14] border-4 border-[#171f33]"></div>
            <p class="text-[#dae2fd]/70 font-space-grotesk">Consulting the oracle...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded mb-8 hidden font-sora mx-4 lg:mx-10">
        </div>

        <!-- Data Grid -->
        <section id="data-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 m-4 lg:m-10">
            <!-- Prediction Cards will be dynamically inserted here -->
        </section>

    </main>

    <footer class="bg-[#0b1326] p-4 text-center text-sm text-[#dae2fd]/50 font-space-grotesk border-t border-white/10">
        <p>&copy; Octo-Bot Predictions. Data strictly read from Database.</p>
    </footer>

    <!-- Application Logic -->
    <script src="/app.js"></script>
</body>
</html>
