<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octo-Bot World Cup Predictions</title>

    <!-- Google Fonts: Space Grotesk, Sora, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sora', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Loading Spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Top App Bar -->
    <header class="bg-gray-800 p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-display font-bold tracking-tight text-blue-400">🐙 Octo-Bot</h1>

            <div class="flex items-center gap-6">
                <!-- Accuracy Score -->
                <div class="flex flex-col items-center">
                    <span class="text-xs uppercase text-gray-400 font-semibold tracking-wider">Global Accuracy</span>
                    <span id="accuracy-score" class="text-xl font-mono font-bold text-green-400">--%</span>
                </div>

                <!-- Manual Triggers -->
                <div class="flex gap-2">
                    <button id="btn-sync" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-semibold text-sm transition-colors flex items-center justify-center gap-2 min-w-[140px]">
                        <span>FETCH FIXTURES</span>
                    </button>
                    <button id="btn-calibrate" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded font-semibold text-sm transition-colors flex items-center justify-center gap-2 min-w-[160px]">
                        <span>RESOLVE RESULTS</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Mascot Display Hero -->
        <section class="mb-12 text-center">
            <div id="mascot-container" class="w-48 h-48 mx-auto bg-gray-800 rounded-full flex items-center justify-center shadow-lg border-4 border-blue-500/30">
                <!-- Placeholder for future mascot animation -->
                <span class="text-6xl">🔮</span>
            </div>
            <div id="algorithm-status" class="mt-4 text-sm text-gray-400">
                <!-- Status text injected via JS -->
            </div>
        </section>

        <!-- Loading State for Initial Data -->
        <div id="main-loader" class="flex flex-col items-center justify-center py-12 hidden">
            <div class="loader w-10 h-10 mb-4 border-t-blue-500 border-4 border-gray-700"></div>
            <p class="text-gray-400 font-display">Consulting the oracle...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="bg-red-900/50 border border-red-500 text-red-200 p-4 rounded mb-8 hidden">
        </div>

        <!-- Data Grid -->
        <section id="data-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Prediction Cards will be dynamically inserted here -->
        </section>

    </main>

    <footer class="bg-gray-950 p-4 text-center text-sm text-gray-500 font-display">
        <p>&copy; Octo-Bot Predictions. Data strictly read from Database.</p>
    </footer>

    <!-- Application Logic -->
    <script src="/app.js"></script>
</body>
</html>
